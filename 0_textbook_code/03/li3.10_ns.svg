<svg xmlns="http://www.w3.org/2000/svg" width="440" height="320"
     font-family="Microsoft YaHei, SimHei, sans-serif" font-size="15">
  <!-- 例 3.10 N-S 盒图（顺序结构）：无箭头、方框共边、整体一个大框 -->
  <!-- 外框 -->
  <rect x="30" y="20" width="380" height="240" fill="none" stroke="black" stroke-width="2"/>
  <!-- 盒1：输入 -->
  <rect x="30" y="20" width="380" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="220" y="45" text-anchor="middle">输入一个大写字母</text>
  <text x="220" y="66" text-anchor="middle">c1 = getchar()</text>
  <!-- 盒2：转换 -->
  <rect x="30" y="80" width="380" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="220" y="105" text-anchor="middle">求对应小写字母的 ASCII 码</text>
  <text x="220" y="126" text-anchor="middle">c2 = c1 + 32</text>
  <!-- 盒3：输出 -->
  <rect x="30" y="140" width="380" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="220" y="165" text-anchor="middle">输出小写字母</text>
  <text x="220" y="186" text-anchor="middle">putchar(c2)</text>
  <!-- 盒4：换行 -->
  <rect x="30" y="200" width="380" height="60" fill="none" stroke="black" stroke-width="1.5"/>
  <text x="220" y="235" text-anchor="middle">换行  putchar('\n')</text>
  <!-- 图注 -->
  <text x="220" y="292" text-anchor="middle" font-size="14">图：例 3.10 的 N-S 盒图（顺序结构，从上到下依次执行）</text>
</svg>
