<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <rect x="0" y="0" width="1200" height="900" fill="#FFFFFF"/>

  <!-- 标题 -->
  <text x="600" y="58" text-anchor="middle" font-size="40" font-weight="bold" fill="#1A202C">一个浮点数，字节被分成"两头"买</text>

  <!-- 思路导引带（把"分一半"讲明白） -->
  <rect x="90" y="78" width="1020" height="98" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="2.5"/>
  <text x="600" y="108" text-anchor="middle" font-size="26" font-weight="bold" fill="#7C2D12">为什么 64 位的 double"才"15 位有效数字？</text>
  <text x="600" y="139" text-anchor="middle" font-size="24" fill="#1A202C">因为 64 个格子不能全拿去记"准不准"（精度）——</text>
  <text x="600" y="166" text-anchor="middle" font-size="24" fill="#1A202C">还得留一部分给"指数"，它决定小数点能挪多远，也就是能表多大、多小的数（范围）。</text>

  <!-- 课本图 3.11：实数分三段 -->
  <text x="110" y="212" font-size="24" font-weight="bold" fill="#2D3748">课本图 3.11：一个实数在内存里分三段存</text>
  <rect x="150" y="226" width="150" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <text x="225" y="254" text-anchor="middle" font-size="24" font-weight="bold" fill="#334155">数符</text>
  <text x="225" y="284" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A202C">+</text>

  <rect x="322" y="226" width="380" height="70" rx="10" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <text x="512" y="254" text-anchor="middle" font-size="24" font-weight="bold" fill="#7C2D12">小数部分（尾数）</text>
  <text x="512" y="284" text-anchor="middle" font-size="27" font-weight="bold" fill="#1A202C" font-family="Consolas, monospace">. 3 1 4 1 5 9</text>

  <text x="712" y="268" text-anchor="end" font-size="26" font-weight="bold" fill="#334155">× 10</text>
  <rect x="722" y="226" width="170" height="70" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="807" y="254" text-anchor="middle" font-size="24" font-weight="bold" fill="#1E40AF">指数</text>
  <text x="807" y="284" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A202C">1</text>
  <text x="912" y="268" text-anchor="start" font-size="26" font-weight="bold" fill="#1A202C">= 3.14159</text>

  <!-- 两条原理 -->
  <rect x="110" y="322" width="480" height="126" rx="14" fill="#FFF7ED" stroke="#EA580C" stroke-width="3"/>
  <text x="350" y="360" text-anchor="middle" font-size="26" font-weight="bold" fill="#7C2D12">尾数（小数部分）占的位愈多</text>
  <text x="350" y="398" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A202C">→ 有效数字愈多 → 精度愈高</text>
  <text x="350" y="430" text-anchor="middle" font-size="23" fill="#334155">决定"能记准几位数"</text>

  <rect x="610" y="322" width="480" height="126" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/>
  <text x="850" y="360" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E40AF">指数部分占的位愈多</text>
  <text x="850" y="398" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A202C">→ 数值范围愈大</text>
  <text x="850" y="430" text-anchor="middle" font-size="23" fill="#334155">决定"能表多大 / 多小的数"</text>
  <text x="600" y="470" text-anchor="middle" font-size="20" fill="#64748B">（以上两句为课本 §3.2.5 原话）</text>

  <!-- float 32 位三段分配条：与图 3.11 一一对应 -->
  <text x="110" y="512" font-size="23" font-weight="bold" fill="#2D3748">float 的 32 位这样分——和上面图 3.11 的三段一一对应（各系统自定，课本按 24＋8）</text>

  <!-- 段名（在条上方） -->
  <text x="176" y="540" text-anchor="middle" font-size="22" font-weight="bold" fill="#334155">数符</text>
  <text x="505" y="540" text-anchor="middle" font-size="23" font-weight="bold" fill="#7C2D12">小数部分（尾数）</text>
  <text x="930" y="540" text-anchor="middle" font-size="23" font-weight="bold" fill="#1E40AF">指数</text>

  <!-- 分配条本体 -->
  <rect x="160" y="548" width="32" height="56" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <rect x="192" y="548" width="628" height="56" fill="#FFEDD5" stroke="#EA580C" stroke-width="2.5"/>
  <rect x="820" y="548" width="220" height="56" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>

  <!-- 大括号：数符+尾数 = 24位；指数 = 8位 -->
  <path d="M160 616 L160 624 L500 624 L500 616" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  <path d="M500 624 L500 632" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  <path d="M500 616 L500 624 L820 624 L820 616" fill="none" stroke="#EA580C" stroke-width="2.5"/>
  <text x="470" y="654" text-anchor="middle" font-size="22" font-weight="bold" fill="#C2410C">数符 ＋ 尾数 ＝ 24 位（含符号）→ 买精度</text>

  <path d="M828 616 L828 624 L1032 624 L1032 616" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
  <path d="M930 624 L930 632" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="935" y="654" text-anchor="middle" font-size="22" font-weight="bold" fill="#1E40AF">指数 ＝ 8 位（含符号）→ 买范围</text>

  <text x="600" y="684" text-anchor="middle" font-size="21" fill="#475569">"数符"算进"尾数 24 位"里（课本：小数部分含符号）；24 ＋ 8 ＝ 32 位 ＝ 4 字节</text>

  <!-- 底部通栏结论 -->
  <rect x="110" y="702" width="980" height="140" rx="14" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  <text x="600" y="742" text-anchor="middle" font-size="28" font-weight="bold" fill="#1A202C">字节 = 买"精度" + 买"范围"，两头分，不是全堆在精度上。</text>
  <text x="600" y="784" text-anchor="middle" font-size="25" fill="#1A202C">double 有 8 字节（64 位），两头都比 float 大 → 有效数字 15 位、范围到 10³⁰⁸。</text>
  <text x="600" y="822" text-anchor="middle" font-size="23" fill="#334155">所以"位数多"不等于"精度按比例高"——得看这些位分给了尾数还是指数。</text>
</svg>
