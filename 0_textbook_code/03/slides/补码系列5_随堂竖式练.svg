<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <rect width="1200" height="900" fill="#ffffff"/>
  <text x="600" y="72" text-anchor="middle" font-size="44" font-weight="bold" fill="#1A202C">随堂动手：换成 8 位存储，你再算一遍 5 + (−5)</text>
  <text x="600" y="128" text-anchor="middle" font-size="30" fill="#2D3748">这回只给 8 个二进制位 —— 三种记法各列一次竖式，算完抬头对答案</text>

  <!-- 列1 原码 -->
  <rect x="30" y="170" width="360" height="420" rx="14" fill="#F7FAFC" stroke="#4A5568" stroke-width="3"/>
  <text x="210" y="225" text-anchor="middle" font-size="34" font-weight="bold" fill="#1A202C">原码</text>
  <g font-family="Consolas, monospace" font-size="32" font-weight="bold" fill="#1A202C">
    <text x="70" y="310">0000 0101</text>
    <text x="70" y="375">+ 1000 0101</text>
    <text x="70" y="465">= _ _ _ _  _ _ _ _</text>
  </g>
  <line x1="60" y1="405" x2="360" y2="405" stroke="#2D3748" stroke-width="3"/>
  <text x="210" y="550" text-anchor="middle" font-size="30" fill="#2D3748">读出来是几？</text>

  <!-- 列2 反码 -->
  <rect x="420" y="170" width="360" height="420" rx="14" fill="#F7FAFC" stroke="#4A5568" stroke-width="3"/>
  <text x="600" y="225" text-anchor="middle" font-size="34" font-weight="bold" fill="#1A202C">反码</text>
  <g font-family="Consolas, monospace" font-size="32" font-weight="bold" fill="#1A202C">
    <text x="460" y="310">0000 0101</text>
    <text x="460" y="375">+ 1111 1010</text>
    <text x="460" y="465">= _ _ _ _  _ _ _ _</text>
  </g>
  <line x1="450" y1="405" x2="750" y2="405" stroke="#2D3748" stroke-width="3"/>
  <text x="600" y="550" text-anchor="middle" font-size="30" fill="#2D3748">读出来是几？</text>

  <!-- 列3 补码 -->
  <rect x="810" y="170" width="360" height="420" rx="14" fill="#F7FAFC" stroke="#4A5568" stroke-width="3"/>
  <text x="990" y="225" text-anchor="middle" font-size="34" font-weight="bold" fill="#1A202C">补码</text>
  <g font-family="Consolas, monospace" font-size="32" font-weight="bold" fill="#1A202C">
    <text x="850" y="310">0000 0101</text>
    <text x="850" y="375">+ 1111 1011</text>
    <text x="850" y="465">= _ _ _ _  _ _ _ _</text>
  </g>
  <line x1="840" y1="405" x2="1140" y2="405" stroke="#2D3748" stroke-width="3"/>
  <text x="990" y="540" text-anchor="middle" font-size="30" fill="#EA580C">要是进出了第 9 位呢？</text>
  <text x="990" y="580" text-anchor="middle" font-size="28" fill="#2D3748">提示：想想刚才那页</text>

  <!-- 底部导引通栏 -->
  <rect x="30" y="640" width="1140" height="140" rx="14" fill="#EBF8FF" stroke="#38BDF8" stroke-width="3"/>
  <text x="600" y="696" text-anchor="middle" font-size="32" font-weight="bold" fill="#2C5282">算完和同桌对：三个结果一样吗？哪个"最干净"？</text>
  <text x="600" y="746" text-anchor="middle" font-size="30" fill="#2D3748">这一页没有答案 —— 你们算出来的就是答案，举手说给我听</text>

  <text x="600" y="836" text-anchor="middle" font-size="28" fill="#2D3748">回看前三张的老规矩：负数补码 = 绝对值写二进制 → 按位取反 → 末位加 1</text>
</svg>
