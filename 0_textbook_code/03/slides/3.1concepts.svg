<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
<rect width="1280" height="960" fill="#F7FAFC"/>
<rect x="40" y="28" width="1200" height="92" rx="14" fill="#2B6CB0"/>
<text x="70" y="86" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#FFFFFF">【动笔划课本】　§3.1　顺序程序设计举例（★开场）</text>
<rect x="40" y="138" width="1200" height="678" rx="14" fill="#1A365D"/>
<text x="70" y="186" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#FBD38D">翻到课本 §3.1，把下面这些【原句】用笔划出来（P 为课本页码）：</text>
<text x="70" y="240" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P37</tspan>　为了能编写出 C 语言程序，必须具备以下的知识和能力：</text>
<text x="70" y="294" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P37</tspan>　（1）要有正确的解题思路，即学会设计算法</text>
<text x="70" y="348" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P37</tspan>　（2）掌握 C 语言的语法，能写出一个完整的、正确的程序</text>
<text x="70" y="402" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P37</tspan>　（3）要采用结构化程序设计方法，编写出结构化的程序</text>
<text x="70" y="456" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P37</tspan>　算法由 3 个步骤组成，这是一个简单的顺序结构</text>
<rect x="40" y="832" width="1200" height="100" rx="14" fill="#4A5568"/>
<text x="70" y="870" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#FFFFFF">【重点】程序＝算法的落地：先有解题思路，再写成 C 程序　　【难点】顺序结构＝几个步骤自上而下依次执行</text>
<text x="70" y="906" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#FEB2B2">【易错易混】编写程序三要素缺一不可：解题思路、C 语法、结构化方法</text>
</svg>
