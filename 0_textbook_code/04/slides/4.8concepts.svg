<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
<rect width="1280" height="960" fill="#F7FAFC"/>
<rect x="40" y="28" width="1200" height="92" rx="14" fill="#2B6CB0"/>
<text x="70" y="86" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#FFFFFF">【动笔划课本】　§4.8　选择结构程序综合举例</text>
<rect x="40" y="138" width="1200" height="678" rx="14" fill="#1A365D"/>
<text x="70" y="186" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#FBD38D">翻到课本 §4.8，把下面这些【原句】用笔划出来（P 为课本页码）：</text>
<text x="70" y="232" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P102</tspan>　前面已学习编写和分析过一些程序，下面再综合介绍几个包含选择结构的应用程序。</text>
<text x="70" y="277" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P102</tspan>　用变量 leap 代表是否为闰年的信息。若闰年，令 leap=1；非闰年，leap=0。（例 4.8 程序 1）</text>
<text x="70" y="322" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P104</tspan>　if((year%4==0 &amp;&amp; year%100!=0) || (year%400==0))（例 4.8 程序 3）</text>
<text x="70" y="367" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P104</tspan>　例 4.9：求 ax^2+bx+c=0 方程的解——先判 a=0，再按 b^2-4ac 分相等实根 / 不等实根 / 共轭复根（图 4.15）</text>
<text x="70" y="412" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P106</tspan>　例 4.10：运输费用——按距离分段折扣，用 switch(c) 实现（图 4.16）</text>
<rect x="40" y="832" width="1200" height="100" rx="14" fill="#4A5568"/>
<text x="70" y="870" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#FFFFFF">【重点】把 if / 逻辑 / switch 串起来的综合实战　　【难点】例 4.9 先判 a==0，再按 disc 分三路</text>
<text x="70" y="906" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#FEB2B2">【易错易混】共轭复根要分开输出实部 realpart 与虚部 imagpart</text>
</svg>