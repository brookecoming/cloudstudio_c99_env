<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960">
<rect width="1280" height="960" fill="#F7FAFC"/>
<rect x="40" y="28" width="1200" height="92" rx="14" fill="#2B6CB0"/>
<text x="70" y="86" font-family="Microsoft YaHei" font-size="30" font-weight="bold" fill="#FFFFFF">【动笔划课本】　§4.1　选择结构和条件判断</text>
<rect x="40" y="138" width="1200" height="678" rx="14" fill="#1A365D"/>
<text x="70" y="186" font-family="Microsoft YaHei" font-size="24" font-weight="bold" fill="#FBD38D">翻到课本 §4.1，把下面这些【原句】用笔划出来（P 为课本页码）：</text>
<text x="70" y="232" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P83</tspan>　在很多情况下，需要根据某个条件是否满足来决定是否执行指定的操作任务，或者从给定的两种或多种操作选择其一。</text>
<text x="126" y="262" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#E2E8F0">这就是选择结构要解决的问题。</text>
<text x="70" y="307" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P83</tspan>　在现实生活中需要进行判断和选择的情况是很多的。</text>
<text x="70" y="352" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P83</tspan>　如果你在家，我去拜访你；如果考试不及格，要补考；如果遇到红灯，要停车等待</text>
<text x="70" y="397" font-family="Microsoft YaHei" font-size="21" font-weight="bold" fill="#FFFFFF"><tspan fill="#FBD38D">P83</tspan>　用 if 语句进行检查，如果 x 的值符合 x&gt;=0 的条件，就输出 x 的值。否则就输出 -x 的值。（图 4.2）</text>
<rect x="40" y="832" width="1200" height="100" rx="14" fill="#4A5568"/>
<text x="70" y="870" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#FFFFFF">【重点】先判断条件、再决定走哪条路　　【难点】“条件”用表达式表示，其值为真 / 假</text>
<text x="70" y="906" font-family="Microsoft YaHei" font-size="18" font-weight="bold" fill="#FEB2B2">【易错易混】if(x&gt;=0) 后面不能加分号，否则判断白做</text>
</svg>